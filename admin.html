<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/common.css" />
    <link rel="stylesheet" href="assets/css/admin.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div class="header">
      <h2>Admin Dashboard</h2>
      <a href="index.html">Logout</a>
    </div>

    <!-- MAIN -->
    <div class="admin-container">

  <!-- ADD COLLEGE CARD -->
<div class="admin-card">
  <h3>Add New College</h3>

  <form id="addCollegeForm" class="admin-form">
    <input type="text" id="collegeName" placeholder="College Name" required />
    <input type="text" id="location" placeholder="Location" required />
    <input type="text" id="fees" placeholder="Fees" required />
    <input type="number" id="placement" placeholder="Placement %" required />
    <input
      type="text"
      id="image"
      placeholder="Image name (ex: bms.jpg)"
    />
    <textarea
      id="description"
      placeholder="College Description"
      rows="3"
    ></textarea>

    <button type="submit">Add College</button>
  </form>
</div>

<!-- EXISTING COLLEGES -->
<div class="existing-colleges">
  <h3>Existing College</h3>
  <ul id="collegeList">
    <li class="college-item">
  <span class="college-name">BMS College of Engineering</span>
  <span class="college-location">— Basavanagudi, Bengaluru</span>
  <button class="delete-btn">Delete</button>
</li>
  </ul>
</div>


    <!-- SCRIPTS -->
    <script type="module" src="js/admin.js"></script>
  </body>
</html>
