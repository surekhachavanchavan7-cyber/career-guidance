<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/admin.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div class="header">
      <h2>Admin Dashboard</h2>
      <a href="index.html">Logout</a>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="admin-container">
      <div class="admin-grid">
        <!-- ADD COLLEGE -->
        <div class="card">
          <h3>Add New College</h3>

          <form id="addCollegeForm">
            <label>College Name</label>
            <input type="text" id="collegeName" required />

            <label>Location</label>
            <input type="text" id="location" required />

            <label>Fees</label>
            <input type="text" id="fees" />

            <label>Placement %</label>
            <input type="number" id="placement" />

            <label>Image Name</label>
            <input type="text" id="image" placeholder="bms.jpg" />

            <label>Description</label>
            <textarea id="description"></textarea>

            <button type="submit">Add College</button>
          </form>
        </div>

        <!-- EXISTING COLLEGES -->
        <div class="card">
          <h3>Existing Colleges</h3>

          <ul class="college-list" id="collegeList">
            <!-- dynamically filled by admin.js -->
          </ul>
        </div>
      </div>
    </div>

    <!-- SCRIPT -->
    <script type="module" src="js/admin.js"></script>
  </body>
</html>
