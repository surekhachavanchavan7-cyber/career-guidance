<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>College Details</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
      }

      .details-wrapper {
        max-width: 1200px;
        margin: 20px auto;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
      }

      .college-img {
        width: 100%;
        max-height: 320px;
        height: auto;
        object-fit: cover; /* THIS fixes clarity */
        border-radius: 16px;
        margin: 24px 0;
        background: #f5f5f5;
        border-radius: 12px;
      }
      s .location {
        color: #666;
        margin-top: -10px;
      }

      .info h3 {
        margin-top: 25px;
      }

      .back-link {
        display: inline-block;
        margin-top: 20px;
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
      }
      #collegeLocation {
        font-size: 18px;
        font-weight: 500;
        color: #374151;
        margin-bottom: 24px;
        margin-top: 8px;
      }
      .back-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 16px;
        background-color: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 14px;
      }

      .back-btn:hover {
        background-color: #1e40af;
      }
    </style>
  </head>

  <body>
    <div class="details-wrapper">
      <h1 id="collegeName"></h1>
      <p id="collegeLocation" class="location"></p>

      <img id="collegeImage" class="college-img" />

      <div class="info">
        <h3>About College</h3>
        <p id="collegeDesc"></p>

        <h3>Courses Offered</h3>
        <ul id="collegeCourses"></ul>

        <h3>Placements</h3>
        <p id="collegePlacement"></p>
      </div>

      <a class="back-btn" href="../student.html">⬅ Go to Student Dashboard</a>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const collegeId = parseInt(params.get("id"));

      const colleges = JSON.parse(localStorage.getItem("colleges")) || [];

      const college = colleges.find((c) => c.id === collegeId);

      if (!college) {
        document.body.innerHTML = `
      <h2 style="padding:20px">College not found</h2>
      <a href="../student.html">⬅ Back to Dashboard</a>
    `;
      } else {
        document.getElementById("collegeName").innerText = college.name;
        document.getElementById("collegeLocation").innerText = college.location;
        document.getElementById("collegeImage").src =
          "../assets/images/" + college.image;

        document.getElementById("collegeDesc").innerText =
          "This is a reputed institute offering quality education.";

        document.getElementById("collegePlacement").innerText =
          "Placement Rate: " + college.placement + "%";

        const ul = document.getElementById("collegeCourses");
        ul.innerHTML = "";

        const courseMap = {
          engineering: ["CSE", "ECE", "Mechanical"],
          design: ["UI/UX", "Product Design"],
          medical: ["MBBS", "BDS"],
          mba: ["Finance", "Marketing"],
        };

        (courseMap[college.course] || []).forEach((course) => {
          const li = document.createElement("li");
          li.innerText = course;
          ul.appendChild(li);
        });
      }
    </script>
  </body>
</html>
