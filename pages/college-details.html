<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>College Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div class="navbar">
      <h2>College Details</h2>
      <a href="../student.html">Back</a>
    </div>

    <!-- CONTENT -->
    <div class="main-container">
      <div id="detailsBox" class="admin-card">
        <p>Loading college details...</p>
      </div>
    </div>

    <!-- FIREBASE -->
    <script type="module">
      import { db } from "../js/firebase-config.js";
      import {
        doc,
        getDoc,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      const box = document.getElementById("detailsBox");

      if (!id) {
        box.innerHTML = "<p>Invalid college.</p>";
      } else {
        loadCollege();
      }

      async function loadCollege() {
        try {
          const ref = doc(db, "colleges", id);
          const snap = await getDoc(ref);

          if (!snap.exists()) {
            box.innerHTML = "<p>College not found.</p>";
            return;
          }

          const c = snap.data();

          box.innerHTML = `
          <img src="../assets/images/${c.image || ""}"
               style="width:100%;max-height:260px;object-fit:cover;border-radius:8px"
               onerror="this.style.display='none'">

          <h3 style="margin-top:15px">${c.name}</h3>
          <p><strong>Location:</strong> ${c.location}</p>
          <p><strong>Fees:</strong> ${c.fees}</p>
          <p><strong>Placement:</strong> ${c.placement}%</p>

          <p style="margin-top:10px">
            <strong>Description:</strong><br/>
            ${c.description || "No description provided."}
          </p>
        `;
        } catch (err) {
          console.error(err);
          box.innerHTML = "<p>Error loading details.</p>";
        }
      }
    </script>
  </body>
</html>
