<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Guidance - Login</title>

    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body>
    <!-- LOGIN FORM ONLY (No navbar here) -->
    <div class="form-box">
      <h2>Career Guidance Portal</h2>
      <p class="subtitle">
        Discover the right career path based on your skills and interests
      </p>

      <input type="text" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />

      <button onclick="login()">Login</button>

      <p class="small">
        New user?
        <a href="pages/create-account.html">Create Account</a>
      </p>

      <div class="info-box">
        <h4>What you can do here:</h4>
        <ul>
          <li>Explore different career options</li>
          <li>View skill requirements</li>
          <li>Follow career roadmaps</li>
        </ul>
      </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
