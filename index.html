<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Career Guidance Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/common.css" />
    <link rel="stylesheet" href="assets/css/login.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <h1>Career Guidance Portal</h1>
        <p>Discover the right career path based on your skills and interests</p>

        <!-- LOGIN FORM -->
        <form id="loginForm">
          <input type="email" id="email" placeholder="Email" required />

          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />

          <button type="submit">Login</button>
        </form>

        <div class="link">
          New user? <a href="pages/create-account.html">Create Account</a>
        </div>

        <hr style="margin: 16px 0" />

        <ul>
          <li>Explore different career options</li>
          <li>View required skills for each career</li>
          <li>Follow structured career roadmaps</li>
          <li>Search and compare colleges</li>
        </ul>
      </div>
    </div>

    <!-- 🔴 IMPORTANT: MODULE SCRIPTS -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
